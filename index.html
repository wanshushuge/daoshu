<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2f7cf6">
<title>倒数日 · 节假日 / 农历 / 纪念日</title>
<script>(function(){try{var t=localStorage.getItem('cd_theme')||'auto';var d=(t==='dark')||(t==='auto'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);if(d)document.documentElement.classList.add('cd-dark');}catch(e){}})();</script>
<style>
:root{
  --bg:#f4f6f9; --card:#ffffff; --text:#1c2733; --sub:#7a8a9c;
  --blue:#2f7cf6; --blue-deep:#1d5fd0; --blue-soft:#eef4ff;
  --green:#0ca678; --green-soft:#e6f7f1;
  --red:#e03131; --red-soft:#fdeaea;
  --orange:#f08c00; --orange-soft:#fff3e0;
  --purple:#7048e8; --purple-soft:#f0ecfd;
  --gold:#e8a700; --gold-soft:#fff7e0;
  --line:#e6ebf1; --header-h:52px;
  --shadow:0 1px 3px rgba(16,35,60,.06);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;line-height:1.55;min-height:100dvh;
}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text)}
.num{font-variant-numeric:tabular-nums}
.hidden{display:none!important}
#appHeader{
  position:sticky;top:0;z-index:900;height:var(--header-h);
  display:flex;align-items:center;gap:8px;padding:0 12px;
  background:linear-gradient(135deg,#2f7cf6,#4c6ef5);color:#fff;
  font-size:16px;font-weight:600;box-shadow:0 2px 10px rgba(47,124,246,.25);
}
#appHeader .hTitle{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#appHeader .hBtn{border:none;background:rgba(255,255,255,.18);color:#fff;width:34px;height:34px;border-radius:9px;font-size:17px;line-height:1;flex:0 0 auto}
main{max-width:720px;margin:0 auto;padding:12px 12px calc(84px + env(safe-area-inset-bottom))}
.view{animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* 顶部统计卡 */
.statCard{
  background:linear-gradient(135deg,#2f7cf6 0%,#4c6ef5 100%);color:#fff;border-radius:16px;
  padding:16px 18px;position:relative;overflow:hidden;box-shadow:0 6px 18px rgba(47,124,246,.25);
}
.statCard::after{content:'';position:absolute;width:180px;height:180px;border-radius:50%;top:-70px;right:-50px;background:radial-gradient(closest-side,rgba(255,255,255,.15),transparent)}
.statCard .yr{font-size:13px;opacity:.9;display:flex;justify-content:space-between;align-items:center}
.statCard .yr b{font-size:15px}
.statCard .big{font-size:30px;font-weight:800;margin:6px 0 2px}
.statCard .big small{font-size:14px;font-weight:500;opacity:.9}
.statCard .bar{height:8px;border-radius:999px;background:rgba(255,255,255,.25);overflow:hidden;margin-top:8px}
.statCard .bar > i{display:block;height:100%;background:#fff;border-radius:999px;transition:width .4s}
.statCard .row{display:flex;gap:10px;margin-top:12px}
.statCard .row .mini{flex:1;background:rgba(255,255,255,.14);border-radius:11px;padding:9px 10px;text-align:center}
.statCard .row .mini b{display:block;font-size:19px;font-weight:800}
.statCard .row .mini span{font-size:11px;opacity:.85}
.statCard .todayLunar{margin-top:10px;font-size:12.5px;opacity:.95;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.statCard .todayLunar .pill{background:rgba(255,255,255,.18);border-radius:8px;padding:2px 8px}

/* 分段筛选 */
.seg{display:flex;gap:8px;margin:14px 0 10px}
.seg button{flex:1;padding:9px 8px;border:1px solid var(--line);background:var(--card);border-radius:10px;font-size:13.5px;color:var(--sub);font-weight:600}
.seg button.on{background:var(--blue);color:#fff;border-color:var(--blue)}

/* 事件卡片 */
.list{display:flex;flex-direction:column;gap:10px}
.ev{
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;
  display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.ev::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--blue)}
.ev.k-holiday::before{background:var(--purple)}
.ev.k-anniv::before{background:var(--green)}
.ev.k-custom::before{background:var(--blue)}
.ev.k-birthday::before{background:var(--gold)}
.ev.k-repeat::before{background:var(--orange)}
.ev.near::before{background:var(--red)}
.ev.pinned{background:var(--blue-soft)}
.ev .ico{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:21px;background:var(--blue-soft);flex:0 0 auto}
.ev.k-holiday .ico{background:var(--purple-soft)}
.ev.k-anniv .ico{background:var(--green-soft)}
.ev.k-birthday .ico{background:var(--gold-soft)}
.ev.k-repeat .ico{background:var(--orange-soft)}
.ev .body{flex:1;min-width:0}
.ev .nm{font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ev .nm .tag{font-size:10px;font-weight:600;padding:1px 6px;border-radius:8px;background:var(--line);color:var(--sub)}
.ev .nm .tag.pin{background:#ffe9a8;color:#9a6b00}
.ev .dt{font-size:12px;color:var(--sub);margin-top:2px}
.ev .big{font-size:26px;font-weight:800;line-height:1.1;margin-top:4px}
.ev .big small{font-size:13px;font-weight:600;color:var(--sub);margin-left:3px}
.ev .big.red{color:var(--red)}
.ev .big.green{color:var(--green)}
.ev .big.orange{color:var(--orange)}
.ev .age{display:inline-block;font-size:11px;font-weight:700;color:#9a6b00;background:var(--gold-soft);border-radius:8px;padding:1px 7px;margin-top:4px}
.ev .ops{display:flex;flex-direction:column;gap:6px;flex:0 0 auto}
.ev .ops button{border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:8px;padding:4px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.ev .ops button.del{color:var(--red);border-color:#f3c9c9}
.ev .ops button.hide{color:var(--orange);border-color:#f3d9a8}
.empty{text-align:center;color:var(--sub);padding:40px 0;font-size:14px}

/* FAB */
.fab{
  position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:920;
  width:56px;height:56px;border-radius:50%;border:none;
  background:linear-gradient(135deg,#2f7cf6,#4c6ef5);color:#fff;font-size:28px;
  box-shadow:0 8px 22px rgba(47,124,246,.4);display:flex;align-items:center;justify-content:center;
}
.fab:active{transform:scale(.94)}

/* Modal */
.mask{position:fixed;inset:0;z-index:960;background:rgba(16,24,40,.45);display:flex;align-items:flex-end;justify-content:center}
.mask.hidden{display:none}
.sheet{
  background:var(--card);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));
  max-height:90dvh;overflow:auto;animation:slideUp .22s ease;
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
.sheet h3{font-size:17px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.sheet h3 .x{border:none;background:var(--bg);color:var(--sub);width:30px;height:30px;border-radius:8px;font-size:16px}
.fld{margin-bottom:13px}
.fld label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:5px;font-weight:600}
.fld input[type=text],.fld input[type=date],.fld input[type=number],.fld select,.fld textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card)}
.fld select{appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' stroke='%237a8a9c' stroke-width='1.6' fill='none' stroke-linecap='round'/></svg>");background-repeat:no-repeat;background-position:right 12px center;padding-right:32px}
.fld textarea{min-height:54px;resize:vertical}
.choices{display:flex;gap:8px;flex-wrap:wrap}
.choices button{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 6px;font-size:13px;color:var(--sub);font-weight:600}
.choices button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.row2{display:flex;gap:10px}
.row2 .fld{flex:1}
.switch{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.switch:last-child{border-bottom:none}
.switch .lab{font-size:13.5px}
.switch .lab small{display:block;color:var(--sub);font-size:11.5px;margin-top:2px}
.sw{width:46px;height:27px;border-radius:999px;background:var(--line);position:relative;flex:0 0 auto;transition:.18s;border:none}
.sw.on{background:var(--blue)}
.sw::after{content:'';position:absolute;width:21px;height:21px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.18s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on::after{left:22px}
.btn-primary{width:100%;border:none;background:linear-gradient(135deg,#2f7cf6,#4c6ef5);color:#fff;font-size:15px;font-weight:700;padding:12px;border-radius:12px;margin-top:6px}
.btn-ghost{width:100%;border:1px solid var(--line);background:var(--card);color:var(--sub);font-size:14px;padding:11px;border-radius:12px;margin-top:8px}

/* 设置列表 */
.setItem{display:flex;align-items:center;justify-content:space-between;padding:12px 2px;border-bottom:1px solid var(--line);gap:10px}
.setItem:last-child{border-bottom:none}
.setItem .lab{font-size:14px}
.setItem .lab small{display:block;color:var(--sub);font-size:11.5px;margin-top:2px}
.holRow{display:flex;align-items:center;justify-content:space-between;padding:9px 2px;border-bottom:1px solid var(--line);gap:10px}
.holRow:last-child{border-bottom:none}
.holRow .nm{font-size:13.5px;flex:1;min-width:0}
.holRow .nm small{color:var(--sub);font-size:11.5px;margin-left:6px}
.tip{font-size:11.5px;color:var(--sub);margin-top:10px;line-height:1.6}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(28,39,51,.92);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:999;opacity:0;transition:opacity .2s;pointer-events:none;max-width:86%;text-align:center}
.toast.show{opacity:1}

/* 深色模式 */
html.cd-dark{
  --bg:#11151c; --card:rgba(30,36,46,.92); --text:#e6edf5; --sub:#9aa8b8; --line:rgba(255,255,255,.10);
  --blue-soft:#1b2b45; --green-soft:#14332b; --red-soft:#3b1f21; --orange-soft:#3a2c14; --purple-soft:#2b2350; --gold-soft:#3a2f10;
  --shadow:0 2px 10px rgba(0,0,0,.35);
}
html.cd-dark body{background:var(--bg);color:var(--text)}
html.cd-dark .ev,html.cd-dark .seg button,html.cd-dark .fld input,html.cd-dark .fld select,html.cd-dark .fld textarea,
html.cd-dark .choices button,html.cd-dark .ev .ops button,html.cd-dark .btn-ghost,html.cd-dark .sheet,html.cd-dark .sw{
  background:var(--card);color:var(--text);border-color:var(--line)}
html.cd-dark .seg button{color:var(--sub)}
html.cd-dark .ev.pinned{background:var(--blue-soft)}
html.cd-dark .ev .age{background:var(--gold-soft)}
html.cd-dark .toast{background:rgba(20,25,33,.95)}
</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
</head>
<body>
<header id="appHeader">
  <div class="hTitle">倒数日</div>
  <button class="hBtn" id="btnSettings" title="设置">⚙️</button>
</header>

<main class="view on">
  <div class="statCard">
    <div class="yr"><span id="yrLabel">2026 年</span><b id="yrPct">—</b></div>
    <div class="big"><span id="yrPassed">0</span><small> 天已过</small></div>
    <div class="bar"><i id="yrBar" style="width:0%"></i></div>
    <div class="todayLunar" id="todayLunar"></div>
    <div class="row">
      <div class="mini"><b id="yrLeft">0</b><span>今年剩余天数</span></div>
      <div class="mini"><b id="nearHoliday">0</b><span>临近节假日(30天内)</span></div>
      <div class="mini"><b id="totalEv">0</b><span>关注事件</span></div>
    </div>
  </div>

  <div class="seg">
    <button data-filter="all" class="on">全部</button>
    <button data-filter="future">倒数中</button>
    <button data-filter="past">已过去</button>
  </div>

  <div class="list" id="list"></div>
  <div class="empty hidden" id="empty">还没有事件，点右下角 + 添加</div>
</main>

<button class="fab" id="btnAdd">+</button>

<!-- 添加/编辑弹窗 -->
<div class="mask hidden" id="maskEdit">
  <div class="sheet">
    <h3><span id="editTitle">添加事件</span><button class="x" data-close="maskEdit">✕</button></h3>
    <div class="fld">
      <label>名称</label>
      <input type="text" id="fName" placeholder="如：国庆节、宝宝生日、每周例会">
    </div>

    <div class="fld">
      <label>类型</label>
      <div class="choices" id="fKind">
        <button data-kind="custom" class="on">倒数日</button>
        <button data-kind="anniv">正数日</button>
        <button data-kind="birthday">生日</button>
        <button data-kind="repeat">重复提醒</button>
      </div>
    </div>

    <!-- 倒数日 / 正数日：固定日期 -->
    <div class="fld" id="grpDate">
      <label id="grpDateLabel">日期</label>
      <input type="date" id="fDate">
    </div>

    <!-- 生日 -->
    <div id="grpBirth" class="hidden">
      <div class="fld">
        <label>生日（月 / 日）</label>
        <input type="date" id="fBDate">
      </div>
      <div class="switch">
        <div class="lab">农历生日<small>按农历过，每年自动换算成公历日期</small></div>
        <button class="sw" id="fBLunar"></button>
      </div>
      <div class="fld">
        <label>出生年份（可选，用于算年龄）</label>
        <input type="number" id="fByear" placeholder="如 1990" min="1900" max="2100">
      </div>
    </div>

    <!-- 重复提醒 -->
    <div id="grpRepeat" class="hidden">
      <div class="fld">
        <label>重复方式</label>
        <div class="choices" id="fFreq">
          <button data-freq="week">每周</button>
          <button data-freq="month">每月</button>
          <button data-freq="year" class="on">每年</button>
        </div>
      </div>
      <div class="fld" id="grpW"><label>星期几</label>
        <select id="fWday">
          <option value="0">星期日</option><option value="1">星期一</option><option value="2">星期二</option>
          <option value="3">星期三</option><option value="4">星期四</option><option value="5">星期五</option><option value="6">星期六</option>
        </select>
      </div>
      <div class="fld hidden" id="grpM"><label>每月几号</label>
        <select id="fMday"></select>
      </div>
      <div class="fld hidden" id="grpY"><label>每年日期</label>
        <input type="date" id="fYmd">
      </div>
    </div>

    <div class="fld">
      <label>备注（可选）</label>
      <textarea id="fNote" placeholder=""></textarea>
    </div>
    <div class="switch">
      <div class="lab">置顶显示<small>排在所有事件最前面</small></div>
      <button class="sw" id="fPin"></button>
    </div>
    <button class="btn-primary" id="btnSave">保存</button>
    <button class="btn-ghost" data-close="maskEdit">取消</button>
  </div>
</div>

<!-- 设置弹窗 -->
<div class="mask hidden" id="maskSet">
  <div class="sheet">
    <h3><span>设置</span><button class="x" data-close="maskSet">✕</button></h3>

    <div class="setItem">
      <div class="lab">外观主题<small>默认跟随手机系统</small></div>
      <div class="choices" id="fTheme" style="flex:0 0 auto;width:210px">
        <button data-theme="auto" class="on">跟随</button>
        <button data-theme="light">浅色</button>
        <button data-theme="dark">深色</button>
      </div>
    </div>

    <div class="setItem">
      <div class="lab">显示已过去的事件<small>正数日 / 已过期的倒数日</small></div>
      <button class="sw on" id="swShowPast"></button>
    </div>

    <div class="setItem">
      <div class="lab">节假日<small id="holMeta">—</small></div>
      <button class="btn-ghost" id="btnResetHoliday" style="width:auto;margin:0;padding:8px 12px">恢复全部显示</button>
    </div>

    <div style="margin-top:6px">
      <div class="lab" style="font-size:12.5px;color:var(--sub);font-weight:600;margin:8px 2px 2px">内置法定节假日（点开关显示/隐藏）</div>
      <div id="holList"></div>
    </div>

    <div class="setItem" style="margin-top:10px">
      <div class="lab">数据备份<small>导出 / 导入 JSON，换设备不丢</small></div>
    </div>
    <button class="btn-ghost" id="btnExport">⬇ 导出数据</button>
    <button class="btn-ghost" id="btnImport">⬆ 导入数据</button>
    <input type="file" id="fileInput" accept="application/json" class="hidden">

    <div class="tip" id="aboutTip"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

    /**
     * 返回农历y年一整年的总天数
     * @param {number} y - lunar Year
     * @returns {number}
     * @eg:var count = solarLunar.lYearDays(1987) ;//count=387
     */
    lYearDays(y) {
      let sum = 348;
      const info = lunarInfo[y - 1900];
      // 优化：直接计算位数，减少循环
      sum += info & 0x8000 ? 1 : 0;
      sum += info & 0x4000 ? 1 : 0;
      sum += info & 0x2000 ? 1 : 0;
      sum += info & 0x1000 ? 1 : 0;
      sum += info & 0x0800 ? 1 : 0;
      sum += info & 0x0400 ? 1 : 0;
      sum += info & 0x0200 ? 1 : 0;
      sum += info & 0x0100 ? 1 : 0;
      sum += info & 0x0080 ? 1 : 0;
      sum += info & 0x0040 ? 1 : 0;
      sum += info & 0x0020 ? 1 : 0;
      sum += info & 0x0010 ? 1 : 0;
      return sum + solarLunar.leapDays(y);
    },

    /**

     * @param {number} y - lunar Year
     * @returns {number} (0-12)
     * @eg:var leapMonth = solarLunar.leapMonth(1987) ;//leapMonth=6
     */
    leapMonth(y) {
      //闰字编码 \u95f0
      return lunarInfo[y - 1900] & 0xf;
    },

    /**

     * @returns {number} (0、29、30)
     * @eg:var leapMonthDay = solarLunar.leapDays(1987) ;//leapMonthDay=29
     */
    leapDays(y) {
      if (solarLunar.leapMonth(y)) {
        return lunarInfo[y - 1900] & 0x10000 ? 30 : 29;
      }
      return 0;
    },

    /**
     * 返回农历 y 年 m 月（非闰月）的总天数，计算 m 为闰月时的天数请使用 leapDays 方法
     * @param {number} y - lunar Year
     * @param {number} m - lunar Month
     * @returns {number} (-1、29、30)
     * @eg:var MonthDay = solarLunar.monthDays(1987,9) ;//MonthDay=29
     */
    monthDays(y, m) {
      if (m > 12 || m < 1) {

      return lunarInfo[y - 1900] & (0x10000 >> m) ? 30 : 29;

  var xu = ty-byear+1;
  return {zhou:zhou,xu:xu};
}
function nextRepeat(e,today){
  today=today||todayStr();var ty=+today.slice(0,4);
  if(e.freq==='week'){var d=parseYmd(today);while(d.getDay()!==e.wday){d.setDate(d.getDate()+1);}return ymd(d);}
  if(e.freq==='month'){var y=ty,m=+today.slice(5,7);var cur=clampMD(y,m,e.mday);if(diffDays(cur,today)<0){m++;if(m>12){m=1;y++;}cur=clampMD(y,m,e.mday);}return cur;}
  var curY=ty+'-'+e.ymd;if(diffDays(curY,today)<0)curY=(ty+1)+'-'+e.ymd;return curY;
}
function repeatSub(e){
  if(e.freq==='week')return '每周'+['日','一','二','三','四','五','六'][e.wday];
  if(e.freq==='month')return '每月'+e.mday+'号';
  return '每年'+e.ymd;
}

/* ---------- 事件求值（核心展示逻辑） ---------- */
function evalEvent(e,today){
  today=today||todayStr();
  if(e.kind==='birthday'){
    var occ=nextBirthday(e,today);var diff=diffDays(occ,today);
    var age='';if(e.byear){var a=calcAge(e.byear,e.bCal,e.bM,e.bD,today);if(a.zhou>=0)age=a.zhou+'岁（虚岁'+a.xu+'）';}
    var lunarTag=e.bCal==='lunar'?('农历'+SL.toChinaMonth(e.bM)+(e.bM===e.bD?SL.toChinaDay(e.bD):'')+SL.toChinaDay(e.bD)):'';
    return {diff:diff,occ:occ,age:age,near:diff>=0&&diff<=7,sub:diff===0?'就是今天':'天后生日',
      bigCls:diff>0&&diff<=7?'red':(diff===0?'orange':''),kindLabel:'🎂生日'+(e.bCal==='lunar'?' · 农历':''),extra:lunarTag,
      dateLine:occ+' · '+weekday(occ)+(e.bCal==='lunar'?' · '+lunarTag:'')};
  }
  if(e.kind==='repeat'){
    var occ2=nextRepeat(e,today);var diff2=diffDays(occ2,today);
    return {diff:diff2,occ:occ2,near:diff2>=0&&diff2<=7,sub:diff2===0?'就是今天':'天后',
      bigCls:diff2>0&&diff2<=7?'red':(diff2===0?'orange':''),kindLabel:'🔁'+repeatSub(e),extra:'',
      dateLine:occ2+' · '+weekday(occ2)+' · '+repeatSub(e)};
  }
  var diff=diffDays(e.date,today);
  var years=null,sub,bigCls,label;
  if(e.kind==='anniv'){
    sub=diff<0?'天前':'天后';bigCls=diff<0?'green':(diff===0?'orange':'');
    if(diff<0)years=Math.floor(Math.abs(diff)/365.25);
    label='💡纪念日';
  } else {
    if(diff>0){sub='天后';bigCls=diff<=7?'red':'';}
    else if(diff===0){sub='就是今天';bigCls='orange';}
    else{sub='天前';bigCls='';}
    label=e.kind==='holiday'?'🏖️假日':'📌自定义';
  }
  var line=e.date+' · '+weekday(e.date);
  if(e.kind==='holiday'&&e.lunarTag)line+=' · '+e.lunarTag;
  if(e.kind==='holiday'&&e.length)line+=' · 放假'+e.length+'天';
  return {diff:diff,occ:e.date,years:years,near:diff>=0&&diff<=7&&e.kind!=='anniv',sub:sub,bigCls:bigCls,kindLabel:label,extra:'',dateLine:line};
}

function sortEvents(list){
  var t=todayStr();
  list.sort(function(a,b){
    var pa=a.pinned?1:0,pb=b.pinned?1:0;if(pa!==pb)return pb-pa;
    var da=Math.abs(diffDays(a._occ||a.date,t)),db=Math.abs(diffDays(b._occ||b.date,t));
    return da-db;
  });
  return list;
}

function render(){
  var y=new Date().getFullYear();
  var start=parseYmd(y+'-01-01'),end=parseYmd((y+1)+'-01-01');
  var totalDays=Math.round((end-start)/86400000);
  var passed=diffDays(todayStr(),y+'-01-01');
  var left=totalDays-passed;
  var pct=Math.max(0,Math.min(100,Math.round(passed/totalDays*100)));
  $('yrLabel').textContent=y+' 年';
  $('yrPct').textContent=pct+'%';
  $('yrPassed').textContent=passed;
  $('yrBar').style.width=pct+'%';
  $('yrLeft').textContent=left;
  $('todayLunar').innerHTML='<span class="pill">农历</span>'+todayLunarStr()+' · '+weekday(todayStr());

  var all=allEvents();
  var near=0;
  all.forEach(function(e){var d=evalEvent(e).diff;if(d>=0&&d<=30&&e.kind==='holiday')near++;});
  $('nearHoliday').textContent=near;
  $('totalEv').textContent=all.length;

  var t=todayStr();
  var list=all.map(function(e){var v=evalEvent(e,t);e._diff=v.diff;e._occ=v.occ;e._v=v;return e;});
  if(filter==='future')list=list.filter(function(e){return e._diff>=0;});
  else if(filter==='past')list=list.filter(function(e){return e._diff<0;});
  list=sortEvents(list);

  var box=$('list');box.innerHTML='';
  if(list.length===0)$('empty').classList.remove('hidden');else $('empty').classList.add('hidden');
  list.forEach(function(e){box.appendChild(renderCard(e));});
}

function renderCard(e){
  var v=e._v;var div=document.createElement('div');
  div.className='ev k-'+e.kind;
  if(v.near)div.className+=' near';
  if(e.pinned)div.className+=' pinned';

  var bigTxt='',sub=v.sub,bigCls=v.bigCls;
  if(v.diff>0)bigTxt=String(v.diff);
  else if(v.diff===0)bigTxt='今天';
  else bigTxt=String(Math.abs(v.diff));

  var tagHtml=e.pinned?'<span class="tag pin">置顶</span>':'<span class="tag">'+v.kindLabel+'</span>';
  var ageHtml=v.age?'<span class="age">'+v.age+'</span>':'';
  var annivHtml='';
  if(e.kind==='anniv'&&v.years&&v.years>=1)annivHtml='<span class="age" style="background:var(--green-soft);color:var(--green)">第 '+v.years+' 周年</span>';

  var ops='';
  if(e.kind==='holiday')ops='<button class="hide" data-hide="'+e.holidayKey+'">隐藏</button>';
  else ops='<button data-edit="'+e.id+'">编辑</button><button class="del" data-del="'+e.id+'">删除</button>';

  div.innerHTML=
    '<div class="ico">'+iconFor(e)+'</div>'+
    '<div class="body">'+
      '<div class="nm">'+escapeHtml(e.name)+tagHtml+'</div>'+
      '<div class="dt">'+v.dateLine+(e.note?' · '+escapeHtml(e.note):'')+'</div>'+
      '<div class="big '+bigCls+'">'+bigTxt+'<small>'+sub+'</small></div>'+
      ageHtml+annivHtml+
    '</div>'+
    '<div class="ops">'+ops+'</div>';
  return div;
}

function iconFor(e){
  if(e.kind==='holiday')return '🏖️';
  if(e.kind==='anniv')return '💡';
  if(e.kind==='birthday')return '🎂';
  if(e.kind==='repeat')return '🔁';
  return '📌';
}
function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function toast(msg){var t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('show');},1800);}

/* ---------- 添加 / 编辑 ---------- */
function showGroup(){
  $('grpDate').classList.toggle('hidden',!(editKind==='custom'||editKind==='anniv'));
  $('grpBirth').classList.toggle('hidden',editKind!=='birthday');
  $('grpRepeat').classList.toggle('hidden',editKind!=='repeat');
  $('grpDateLabel').textContent = editKind==='anniv'?'纪念日期':'目标日期';
}
function openAdd(){
  editId=null;editKind='custom';editPin=false;editBLunar=false;editFreq='year';
  $('editTitle').textContent='添加事件';
  $('fName').value='';$('fDate').value='';$('fBDate').value='';$('fByear').value='';$('fYmd').value='';
  $('fNote').value='';$('fMday').value='1';$('fWday').value='1';
  setKind('custom');setPin(false);setBLunar(false);setFreq('year');showGroup();
  showMask('maskEdit');
}
function openEdit(id){
  var e=events.filter(function(x){return x.id===id;})[0];if(!e)return;
  editId=id;editKind=e.kind||'custom';editPin=!!e.pinned;editBLunar=(e.bCal==='lunar');editFreq=e.freq||'year';
  $('editTitle').textContent='编辑事件';
  $('fName').value=e.name;
  if(editKind==='birthday'){$('fBDate').value=(e.bM?pad(e.bM):'01')+'-'+(e.bD?pad(e.bD):'01')+'-'+'2000';$('fByear').value=e.byear||'';}
  else if(editKind==='repeat'){$('fWday').value=String(e.wday!=null?e.wday:1);$('fMday').value=String(e.mday!=null?e.mday:1);$('fYmd').value=e.ymd||'';}
  else {$('fDate').value=e.date||'';}
  $('fNote').value=e.note||'';
  setKind(editKind);setPin(editPin);setBLunar(editBLunar);setFreq(editFreq);showGroup();
  showMask('maskEdit');
}
function setKind(k){editKind=k;document.querySelectorAll('#fKind button').forEach(function(b){b.classList.toggle('on',b.dataset.kind===k);});}
function setPin(on){editPin=on;$('fPin').classList.toggle('on',on);}
function setBLunar(on){editBLunar=on;$('fBLunar').classList.toggle('on',on);}
function setFreq(f){editFreq=f;document.querySelectorAll('#fFreq button').forEach(function(b){b.classList.toggle('on',b.dataset.freq===f);});showFreqGroup();}
function showFreqGroup(){
  $('grpW').classList.toggle('hidden',editFreq!=='week');
  $('grpM').classList.toggle('hidden',editFreq!=='month');
  $('grpY').classList.toggle('hidden',editFreq!=='year');
}
function saveEdit(){
  var name=$('fName').value.trim();if(!name){toast('请填写名称');return;}
  var obj={name:name,note:$('fNote').value.trim(),pinned:editPin};
  if(editKind==='birthday'){
    var bd=$('fBDate').value;if(!bd){toast('请选择生日');return;}
    var p=bd.split('-');obj.bCal=editBLunar?'lunar':'solar';obj.bM=+p[1];obj.bD=+p[2];
    var by=$('fByear').value.trim();obj.byear=by?+by:'';
    obj.kind='birthday';
  } else if(editKind==='repeat'){
    obj.freq=editFreq;
    if(editFreq==='week')obj.wday=+$('fWday').value;
    else if(editFreq==='month')obj.mday=+$('fMday').value;
    else obj.ymd=$('fYmd').value||'';
    if(editFreq!=='year'&&!obj.ymd&&editFreq==='year'){toast('请选择每年日期');return;}
    if(editFreq==='year'&&!$('fYmd').value){toast('请选择每年日期');return;}
    obj.kind='repeat';
  } else {
    var dt=$('fDate').value;if(!dt){toast('请选择日期');return;}
    obj.date=dt;obj.kind=editKind;
  }
  if(editId){var e=events.filter(function(x){return x.id===editId;})[0];if(e)Object.assign(e,obj);}
  else {obj.id='e'+Date.now()+Math.floor(Math.random()*999);events.push(obj);}
  saveEvents(events);hideMask('maskEdit');render();toast('已保存');
}

/* ---------- 删除 / 隐藏 / 置顶 ---------- */
function delEvent(id){events=events.filter(function(x){return x.id!==id;});saveEvents(events);render();toast('已删除');}
function hideHoliday(key){if(settings.hiddenHolidays.indexOf(key)===-1){settings.hiddenHolidays.push(key);saveSettings();}render();toast('已隐藏该节假日');}
function togglePin(id){var e=events.filter(function(x){return x.id===id;})[0];if(e){e.pinned=!e.pinned;saveEvents(events);render();}}

/* ---------- 设置 ---------- */
function saveSettings(){try{localStorage.setItem(LS_SETTINGS,JSON.stringify(settings));}catch(e){}}
function applyTheme(){
  var t=settings.theme||'auto';
  var dark=(t==='dark')||(t==='auto'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.classList.toggle('cd-dark',dark);
  document.querySelectorAll('#fTheme button').forEach(function(b){b.classList.toggle('on',b.dataset.theme===t);});
}
function renderHolidayList(){
  var y=new Date().getFullYear();var box=$('holList');box.innerHTML='';
  holidayEvents().forEach(function(h){
    var hidden=(settings.hiddenHolidays||[]).indexOf(h.holidayKey)!==-1;
    var row=document.createElement('div');row.className='holRow';
    row.innerHTML='<div class="nm">'+escapeHtml(h.name)+'<small>'+h.date+(h.length?' · 放假'+h.length+'天':'')+'</small></div>';
    var sw=document.createElement('button');sw.className='sw'+(hidden?'':' on');sw.dataset.hkey=h.holidayKey;
    sw.onclick=function(){
      var i=settings.hiddenHolidays.indexOf(h.holidayKey);
      if(i===-1)settings.hiddenHolidays.push(h.holidayKey);else settings.hiddenHolidays.splice(i,1);
      saveSettings();renderHolidayList();render();
    };
    row.appendChild(sw);box.appendChild(row);
  });
  $('holMeta').textContent='按农历/公历规则逐年自动推算 · 跨年自动更新';
}
function exportData(){
  var payload={app:'countdown',version:APP_VERSION,exported:new Date().toISOString(),events:events,settings:settings};
  var blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='倒数日数据_'+todayStr()+'.json';a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
  toast('已导出数据文件');
}
function importData(text){
  try{
    var o=JSON.parse(text);
    if(!o||!Array.isArray(o.events)){toast('文件格式不对');return;}
    events=o.events;saveEvents(events);
    if(o.settings){settings=Object.assign(defSettings(),o.settings);saveSettings();applyTheme();renderHolidayList();}
    render();toast('已导入 '+events.length+' 条事件');
  }catch(e){toast('导入失败：'+e.message);}
}

/* ---------- UI 辅助 ---------- */
function showMask(id){$(id).classList.remove('hidden');}
function hideMask(id){$(id).classList.add('hidden');}

/* ---------- 事件绑定 ---------- */
function bind(){
  $('btnAdd').onclick=openAdd;
  $('btnSettings').onclick=function(){$('swShowPast').classList.toggle('on',settings.showPast);renderHolidayList();showMask('maskSet');};
  $('btnSave').onclick=saveEdit;
  $('fPin').onclick=function(){setPin(!editPin);};
  $('fBLunar').onclick=function(){setBLunar(!editBLunar);};
  document.querySelectorAll('#fKind button').forEach(function(b){b.onclick=function(){setKind(b.dataset.kind);showGroup();};});
  document.querySelectorAll('#fFreq button').forEach(function(b){b.onclick=function(){setFreq(b.dataset.freq);};});

  document.querySelectorAll('[data-close]').forEach(function(b){b.onclick=function(){hideMask(b.dataset.close);};});
  document.querySelectorAll('.mask').forEach(function(m){m.onclick=function(e){if(e.target===m)hideMask(m.id);};});

  document.querySelectorAll('.seg button').forEach(function(b){b.onclick=function(){
    document.querySelectorAll('.seg button').forEach(function(x){x.classList.remove('on');});
    b.classList.add('on');filter=b.dataset.filter;render();
  };});

  $('list').onclick=function(e){
    var t=e.target.closest('[data-edit],[data-del],[data-hide]');if(!t)return;
    if(t.dataset.edit)openEdit(t.dataset.edit);
    else if(t.dataset.del)delEvent(t.dataset.del);
    else if(t.dataset.hide)hideHoliday(t.dataset.hide);
  };

  document.querySelectorAll('#fTheme button').forEach(function(b){b.onclick=function(){settings.theme=b.dataset.theme;saveSettings();applyTheme();};});
  $('swShowPast').onclick=function(){settings.showPast=!settings.showPast;saveSettings();this.classList.toggle('on',settings.showPast);render();};
  $('btnResetHoliday').onclick=function(){settings.hiddenHolidays=[];saveSettings();renderHolidayList();render();toast('已恢复全部节假日');};
  $('btnExport').onclick=exportData;
  $('btnImport').onclick=function(){$('fileInput').click();};
  $('fileInput').onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){importData(r.result);hideMask('maskSet');};r.readAsText(f);this.value='';};

  // 填充「每月几号」下拉
  var md=$('fMday');for(var i=1;i<=31;i++){var o=document.createElement('option');o.value=i;o.textContent=i+' 号';md.appendChild(o);}

  $('aboutTip').textContent='倒数日 v2.0｜数据仅存本机浏览器，清缓存会丢失，建议定期导出备份。节假日按农历/公历规则逐年自动推算（春节=正月初一、端午=五月初五、中秋=八月十五、重阳=九月初九、清明=节气，元旦/劳动/国庆为公历固定日），跨年自动更新，无需手动维护。';
}

// 每月切换时刷新（如当天跨午夜）
var _lastDay=todayStr();
setInterval(function(){if(todayStr()!==_lastDay){_lastDay=todayStr();render();}},60000);

bind();
applyTheme();
render();

// 暴露给测试
window.CD={
  SL:SL, festivalDates:festivalDates, holidayEvents:holidayEvents, allEvents:allEvents,
  evalEvent:evalEvent, nextBirthday:nextBirthday, nextRepeat:nextRepeat, calcAge:calcAge, repeatSub:repeatSub,
  lunar2solarStr:lunar2solarStr, solarLunarDesc:solarLunarDesc, todayLunarStr:todayLunarStr,
  diffDays:diffDays, render:render,
  addEvent:function(o){events.push(Object.assign({id:'e'+Date.now()+Math.random(),kind:'custom',pinned:false},o));saveEvents(events);},
  getEvents:function(){return events;}, setEvents:function(a){events=a;saveEvents(events);},
  delEvent:delEvent, hideHoliday:hideHoliday, togglePin:togglePin,
  getSettings:function(){return settings;}, setSettings:function(s){settings=s;saveSettings();},
  setFilter:function(f){filter=f;},
  openAdd:openAdd, saveEdit:saveEdit, setKind:setKind
};
})();
</script>

if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(e){console.warn('SW注册失败',e);});});}
